<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Planner</title>
<meta name="description" content="Plan your day, track what's done, and let unfinished tasks carry forward automatically.">
<meta name="theme-color" content="#0F6E63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-shell" id="appShell">
  <nav class="sidebar" id="sidebar">
    <div class="brand">
      <img src="icons/logo.svg" alt="" width="30" height="30">
      <span>Daily Planner</span>
    </div>
    <button class="navitem" data-view="dashboard" data-icon="home">Dashboard</button>
    <button class="navitem" data-view="tasks" data-icon="list">Tasks</button>
    <button class="navitem" data-view="add" data-icon="plus">Add task</button>
    <button class="navitem install-item" id="installBtnDesktop" data-icon="download" hidden>Install app</button>
    <div class="sidebar-foot" id="sidebarFoot"></div>
  </nav>

  <div class="main">
    <header class="topbar">
      <div>
        <h1 id="topTitle">Dashboard</h1>
        <div class="date" id="topDate"></div>
      </div>
      <div class="bell-wrap">
        <button class="bell-btn" id="bellBtn" aria-label="End of day reminders" data-icon="bell"></button>
        <span class="bell-badge" id="bellBadge" hidden></span>
      </div>
    </header>

    <div class="ios-banner" id="iosBanner" hidden>
      <span>Install Daily Planner on this iPhone: tap <b>Share</b>, then <b>Add to Home Screen</b>.</span>
      <button id="iosBannerClose" aria-label="Dismiss" data-icon="x"></button>
    </div>

    <main class="view" id="view"></main>

    <nav class="bottomnav" id="bottomnav">
      <button class="bn-item" data-view="dashboard" data-icon="home"><span>Home</span></button>
      <button class="bn-item" data-view="tasks" data-icon="list"><span>Tasks</span></button>
      <button class="bn-fab" data-view="add" data-icon="plus" aria-label="Add task"></button>
      <button class="bn-item" id="bellBtnMobile" data-icon="bell"><span>Alerts</span></button>
      <button class="bn-item install-item" id="installBtnMobile" data-icon="download" hidden><span>Install</span></button>
    </nav>
  </div>

  <div class="overlay-backdrop" id="backdrop"></div>
  <div class="eod-panel" id="eodPanel"></div>
  <div class="modal" id="rescheduleModal"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
